# Nginx 反向代理（HTTPS 用 certbot 签发）
#
# 使用步骤：
#   1. sudo cp docker/prod/nginx.conf /etc/nginx/sites-available/dsa
#   2. sudo ln -sf /etc/nginx/sites-available/dsa /etc/nginx/sites-enabled/dsa
#   3. sudo rm -f /etc/nginx/sites-enabled/default
#   4. 把 server_name 改成你的域名；sudo nginx -t && sudo systemctl reload nginx
#   5. sudo apt install -y certbot python3-certbot-nginx
#      sudo certbot --nginx -d your-domain.com
#
# 要点（缺一个就会出现「页面卡住/样式丢失/登录异常」）：
#   - proxy_buffering off         ：SSE 实时进度必须关闭缓冲
#   - proxy_read_timeout 3600s    ：分析任务会跑几分钟
#   - Upgrade / Connection        ：Agent 对话页的 WebSocket
#   - X-Forwarded-Proto           ：登录 Cookie 的 Secure 判定

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket（Agent 对话）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE（分析进度 / Agent 流式输出）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
